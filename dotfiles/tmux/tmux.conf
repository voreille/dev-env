##### General ###############################################################

set -g mouse on
set -g history-limit 100000
set -sg escape-time 0
set -g focus-events on

setw -g mode-keys vi


##### Terminal / colors #####################################################

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB:clipboard"

set -g allow-passthrough on
set -s set-clipboard on

##### Windows ###############################################################

# Start numbering at 1 and remove gaps after closing windows.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window title shown by the terminal.
set -g set-titles on
set -g set-titles-string '#{host_short}:#S:#I.#P #W'

set -g status-left-length 50
set -g status-left '#[bold] #{user}@#{host_short} | #S #[default]'

# Ctrl-b Shift-t: select a colour for the current tmux session.
bind t display-menu -T "Tmux identity" \
    "Local    green"  g "set-option status-style bg=#50fa7b,fg=#282a36" \
    "Server 1 cyan"   c "set-option status-style bg=#8be9fd,fg=#282a36" \
    "Server 2 purple" p "set-option status-style bg=#bd93f9,fg=#282a36" \
    "Server 3 orange" o "set-option status-style bg=#ffb86c,fg=#282a36" \
    "Danger   red"    r "set-option status-style bg=#ff5555,fg=#282a36" \
    "Default"         d "set-option -u status-style"

# Direct window selection; pressing the current window again returns to the
# previously selected window.
bind -n M-1 select-window -T -t :=1
bind -n M-2 select-window -T -t :=2
bind -n M-3 select-window -T -t :=3
bind -n M-4 select-window -T -t :=4
bind -n M-5 select-window -T -t :=5
bind -n M-6 select-window -T -t :=6
bind -n M-7 select-window -T -t :=7
bind -n M-8 select-window -T -t :=8
bind -n M-9 select-window -T -t :=9

# Windows
bind -n C-M-h next-window
bind -n C-M-l previous-window

# Toggle last/current window
bind -n M-t last-window

##### Panes #################################################################

# Prefix-based splits inherit the current pane directory.
unbind '"'
unbind %

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Quick side shell.
# Create, hide, or restore the right-hand utility pane.
bind -n M-x if-shell -F '#{window_zoomed_flag}' {
    resize-pane -Z
    select-pane -t :.2
} {
    if-shell -F '#{==:#{window_panes},1}' {
        split-window -h -p 35 -c "#{pane_current_path}"
    } {
        select-pane -t :.1
        resize-pane -Z
    }
}

# Prefix-free pane navigation.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Close current pane.
bind -n M-q kill-pane

# Optional prefix-based fallback.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


##### Popup #################################################################

# Ctrl-b g: temporary shell in the current directory.
bind g display-popup \
    -E \
    -d "#{pane_current_path}" \
    -w 80% \
    -h 80%


##### Config ################################################################

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
