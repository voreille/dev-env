##### General ###############################################################

set -g mouse on
set -g history-limit 100000
set -sg escape-time 0
set -g focus-events on

setw -g mode-keys vi


##### Terminal / colors #####################################################

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"


##### Windows ###############################################################

# Start numbering at 1 and remove gaps after closing windows.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window title shown by the terminal.
set -g set-titles on
set -g set-titles-string '#S:#I.#P #W'

# Direct window selection.
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Windows
bind -n C-M-j next-window
bind -n C-M-k previous-window

# Toggle last/current window
bind -n M-t last-window

##### Panes #################################################################

# Prefix-based splits inherit the current pane directory.
unbind '"'
unbind %

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Quick bottom shell.
bind -n M-x split-window -v -p 25 -c "#{pane_current_path}"

# Prefix-free pane navigation.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Close current pane.
bind -n M-q kill-pane

# Optional prefix-based fallback.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


##### Popup #################################################################

# Ctrl-b g: temporary shell in the current directory.
bind g display-popup \
    -E \
    -d "#{pane_current_path}" \
    -w 80% \
    -h 80%


##### Config ################################################################

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
